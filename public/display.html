<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FSHOW Juegos · Pantalla</title>
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url("/fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 800; src: url("/fonts/barlow-condensed-latin-800-normal.woff2") format("woff2"); }

  :root {
    /* Colores de FSHOW */
    --navy: #070745; --blue: #0319d6; --blue-d: #050f84; --red: #ff2925; --green: #12a150;
    --sk: skewX(-7deg); --k: 0.95;
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: #fff;
               font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif; font-weight: 800; }

  /* Lienzo fijo de 1920x1080 que se escala para caber en cualquier ventana (en vMix a 1920x1080 la escala es 1) */
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #root { position: absolute; inset: 0; }
  .wrap { position: absolute; inset: 0; }

  .plate { transform: var(--sk); box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .enter { animation: enter .45s cubic-bezier(.2,.8,.2,1) both; }
  .pop   { animation: pop .4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes pop   { from { opacity: 0; transform: var(--sk) translateX(var(--dx, -80px)); } to { opacity: 1; transform: var(--sk); } }

  /* Encabezado arriba a la izquierda; puntos y reloj en una segunda fila debajo.
     La esquina superior derecha (ESPN VIVO) y la inferior derecha (hashtag) quedan libres */
  .hdr { position: absolute; left: 90px; top: 54px; display: flex; align-items: stretch; height: 92px; }
  .logo { height: 92px; width: auto; margin-right: 18px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.4)); }
  .title { display: flex; align-items: center; padding: 0 28px; background: var(--navy);
           border-left: 10px solid var(--red); font-size: 46px; letter-spacing: 1px;
           text-transform: uppercase; white-space: nowrap; }
  .chips { position: absolute; left: 100px; top: 162px; display: flex; gap: 10px; height: 70px; }
  .pts { display: flex; align-items: center; padding: 0 26px; background: var(--red); font-size: 46px; white-space: nowrap; }

  /* Reloj: blanco con números rojos parpadeando en los últimos 10 s */
  .clock { display: flex; align-items: center; justify-content: center; min-width: 150px; padding: 0 24px;
           background: #fff; color: var(--navy); font-size: 50px; white-space: nowrap; }
  .clock.low { color: var(--red); animation: blink 1s steps(1, end) infinite; }
  .clock.end { color: var(--red); animation: blink .5s steps(1, end) infinite; }
  @keyframes blink { 50% { opacity: .45; } }

  /* Ítems alrededor del invitado (todo escala con --k) */
  .slot { position: absolute; height: calc(130px * var(--k)); display: flex; align-items: center; }
  .row { display: flex; align-items: center; width: 100%; min-height: calc(88px * var(--k));
         background: linear-gradient(90deg, var(--blue), var(--blue-d)); }
  .row .n { align-self: stretch; width: calc(72px * var(--k)); flex: none; display: flex; align-items: center; justify-content: center;
            background: var(--red); font-size: calc(50px * var(--k)); }
  .row .t { padding: 6px 20px 8px 18px; font-size: calc(40px * var(--k)); font-weight: 700; line-height: 1.05; letter-spacing: .2px; }
  .row.hid { background: rgba(7,7,69,.84); }
  .row.hid .n { background: rgba(255,255,255,.2); }
  .row.hid .t { opacity: .45; }

  /* Tercio inferior (respuesta, afirmación, título del ranking) */
  .lower { position: absolute; left: 0; right: 0; bottom: 60px; display: flex; justify-content: center; }
  .answer { width: 1000px; padding: 2px 24px 8px; background: #fff; color: var(--navy); text-align: center;
            border-left: 18px solid var(--red); font-size: 84px; text-transform: uppercase; }
  .score-chip { display: flex; align-items: center; padding: 0 24px; background: var(--navy);
                border-right: 12px solid var(--red); font-size: 44px; white-space: nowrap; }

  .stmt { width: 1400px; min-height: 140px; padding: 22px 44px; display: flex; align-items: center;
          background: linear-gradient(90deg, var(--blue), var(--blue-d)); font-size: 54px; font-weight: 700; line-height: 1.1; }
  .stmt.dim { width: 260px; min-height: 100px; justify-content: center; background: rgba(7,7,69,.84); font-size: 70px; }
  .mid-right { position: absolute; right: 90px; top: 0; bottom: 0; display: flex; align-items: center; }
  .verdict { padding: 6px 44px 14px; background: var(--green); font-size: 92px; letter-spacing: 2px; }
  .verdict.f { background: var(--red); }

  .sub { padding: 6px 64px 10px; background: var(--red); font-size: 58px; text-transform: uppercase; }

  /* Con fondo de chroma: sin sombras ni transparencias (si no, quedan bordes sucios al quitar el color) */
  body.chroma .plate { box-shadow: none; }
  body.chroma .logo { filter: none; }
  body.chroma .row.hid, body.chroma .stmt.dim { background: #1f1f55; }
  body.chroma .clock.low, body.chroma .clock.end { animation: none; background: var(--red); color: #fff; }
  /* Con chroma verde, el cartel VERDADERO pasa a azul para que no se borre */
  body.bg-green .verdict:not(.f) { background: var(--blue); }

  /* Solo con ?preview: fondo gris con la silueta de un invitado en plano medio */
  body.preview { background: #10142a; }
  body.preview #stage { background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAxOTIwIDEwODAnPjxjaXJjbGUgY3g9Jzk0OCcgY3k9JzI5Micgcj0nMTUwJyBmaWxsPSd3aGl0ZScgZmlsbC1vcGFjaXR5PScuMTYnLz48cGF0aCBkPSdNNTAwIDEwODAgTDUzMCA4MDAgQzU2MCA2MDAgNzAwIDQ3MCA4NjAgNDQwIEwxMDQwIDQ0MCBDMTIwMCA0NzAgMTMwMCA2MDAgMTMxNSA4MDAgTDEzNDUgMTA4MCBaJyBmaWxsPSd3aGl0ZScgZmlsbC1vcGFjaXR5PScuMTYnLz48L3N2Zz4=') center/100% 100% no-repeat,
                        radial-gradient(ellipse at 50% 40%, #3b4468 0%, #151a2e 80%); }

  /* Solo con ?guides: zonas de los gráficos fijos de ESPN */
  #guides { display: none; position: absolute; inset: 0; pointer-events: none; }
  body.guides #guides { display: block; }
  #guides div { position: absolute; box-sizing: border-box; border: 3px dashed #ffe600; background: rgba(255,230,0,.13);
                color: #ffe600; font: 800 26px Arial, sans-serif; padding: 4px 10px; }
</style>
</head>
<body>
<div id="stage">
  <div id="guides">
    <div style="left:0;top:790px;width:1920px;height:200px">TERCIO INFERIOR ESPN</div>
    <div style="left:1660px;top:50px;width:180px;height:95px">ESPN VIVO</div>
    <div style="left:1460px;top:790px;width:310px;height:60px">#HASHTAG</div>
  </div>
  <div id="root"></div>
</div>
<script>
// Geometría de los ítems alrededor del invitado (lienzo de 1920x1080).
// K = tamaño (1 = más chico, 1.2 = más grande) · W = ancho de cada ítem · MARGIN = margen de seguridad de TV
// Y0..Y1 = franja vertical que ocupan · BOW = cuánto se acercan al centro los ítems de arriba (siguen la cabeza y hombros)
const CFG = { W: 380, K: 0.95, MARGIN: 90, Y0: 250, Y1: 720, BOW: 230 };
document.documentElement.style.setProperty('--k', CFG.K);

const stage = document.getElementById('stage');
const root = document.getElementById('root');
const Q = new URLSearchParams(location.search);
const PREVIEW = Q.has('preview');
if (PREVIEW) document.body.classList.add('preview');
if (Q.has('guides')) document.body.classList.add('guides');

// Fondo para chroma: none = transparente, green = verde croma, magenta
function applyBg(bg) {
  const color = bg === 'green' ? '#00b140' : bg === 'magenta' ? '#ff00ff' : '';
  document.documentElement.style.background = color;
  document.body.classList.toggle('bg-green', bg === 'green');
  document.body.classList.toggle('chroma', !!color);
  document.body.classList.toggle('preview', PREVIEW && !color);
}
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
let prev = null, prevSig = null;
ws.onmessage = e => {
  const s = JSON.parse(e.data);
  const { timer, ...rest } = s;
  const sig = JSON.stringify(rest) + (timer.show ? '1' : '0');
  if (prev && sig === prevSig) { updateClock(timer); prev = s; return; } // solo cambió el reloj
  prevSig = sig; render(s); prev = s;
};
ws.onclose = () => setTimeout(() => location.reload(), 2000);

const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const fmt = sec => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
const clockTxt = t => fmt(Math.ceil(t.remaining));
const clockCls = t => t.remaining <= 0 ? 'end' : (t.running && Math.ceil(t.remaining) <= 10 ? 'low' : '');
const clockHtml = t => t && t.show ? `<div class="plate clock ${clockCls(t)}">${clockTxt(t)}</div>` : '';
function updateClock(t) {
  const el = root.querySelector('.clock');
  if (el) { el.textContent = clockTxt(t); el.className = 'plate clock ' + clockCls(t); }
}
const hdr = (title, pts, t, extra = '') => {
  const chips = (pts ? `<div class="plate pts">${pts}</div>` : '') + clockHtml(t) + extra;
  return `<div class="hdr"><img class="logo" src="/logo.png" alt=""><div class="plate title">${title}</div></div>` +
    (chips ? `<div class="chips">${chips}</div>` : '');
};

// Posición del ítem i de n: mitad a la izquierda y mitad a la derecha, en columnas pegadas al margen.
// Los de arriba se acercan al centro (la cabeza es angosta) y los de abajo se alejan (los hombros son anchos).
function place(n, i) {
  const nl = Math.ceil(n / 2), left = i < nl;
  const count = left ? nl : n - nl, idx = left ? i : i - nl;
  const y = CFG.Y0 + (CFG.Y1 - CFG.Y0) * (idx + 0.5) / count;
  const shift = CFG.BOW * Math.min(1, Math.max(0, (CFG.Y1 - y) / (CFG.Y1 - CFG.Y0)));
  const x = left ? CFG.MARGIN + shift : 1920 - CFG.MARGIN - CFG.W - shift;
  return { x, y, dir: left ? -1 : 1 };
}
function item(n, i, shown, isNew, text) {
  const p = place(n, i);
  return `<div class="slot" style="left:${p.x}px;top:${p.y - 65 * CFG.K}px;width:${CFG.W}px">
    <div class="plate row${shown ? '' : ' hid'}${isNew ? ' pop' : ''}" style="--dx:${p.dir < 0 ? -80 : 80}px">
      <div class="n">${i + 1}</div><div class="t">${shown ? esc(text) : '?'}</div></div></div>`;
}

function render(s) {
  applyBg(s.bg);
  const h = s.game === 'adivina' ? adivina(s) : s.game === 'vf' ? vf(s) : s.game === 'top5' ? top5(s) : '';
  const changed = !prev || prev.game !== s.game;
  root.innerHTML = h ? `<div class="wrap ${changed ? 'enter' : ''}">${h}</div>` : '';
}

function adivina(s) {
  const A = s.adivina, q = s.content.adivina[A.idx], n = q.pistas.length;
  const pts = Math.max(1, n - Math.max(A.revealed, 1) + 1);
  const P = prev && prev.game === 'adivina' && prev.adivina.idx === A.idx ? prev.adivina : null;
  const items = q.pistas.map((p, i) => {
    const shown = i < A.revealed;
    return item(n, i, shown, shown && P && i >= P.revealed, p);
  }).join('');
  const ans = A.solved ? `<div class="lower"><div class="plate answer${P && !P.solved ? ' pop' : ''}" style="--dx:0px">${esc(q.respuesta)}</div></div>` : '';
  return hdr('¿Quién es el jugador?', A.solved ? '' : `${pts} PTS`, s.timer,
             `<div class="plate score-chip">Puntaje ${A.score}</div>`) + items + ans;
}

function vf(s) {
  const V = s.vf, q = s.content.vf[V.idx];
  const P = prev && prev.game === 'vf' && prev.vf.idx === V.idx ? prev.vf : null;
  const stmt = V.shown
    ? `<div class="plate stmt${P && !P.shown ? ' pop' : ''}" style="--dx:0px">${esc(q.texto)}</div>`
    : `<div class="plate stmt dim">?</div>`;
  const verdict = V.reveal
    ? `<div class="mid-right"><div class="plate verdict ${q.verdad ? '' : 'f'}${P && !P.reveal ? ' pop' : ''}" style="--dx:80px">${q.verdad ? 'VERDADERO' : 'FALSO'}</div></div>` : '';
  return hdr('Verdadero o falso', `${V.score} / ${V.answered}`, s.timer) + verdict + `<div class="lower">${stmt}</div>`;
}

function top5(s) {
  const T = s.top5, q = s.content.top5[T.idx];
  const P = prev && prev.game === 'top5' && prev.top5.idx === T.idx ? prev.top5 : null;
  const items = q.items.map((it, i) => item(q.items.length, i, T.rev[i], T.rev[i] && P && !P.rev[i], it)).join('');
  return hdr('Top 5', '', s.timer) + items + `<div class="lower"><div class="plate sub">${esc(q.titulo)}</div></div>`;
}
</script>
</body>
</html>
